bookdown::gitbook:
  css: style.css # This is how bookdown knows to look at style.css for formatting
  pandoc_args:
    - "--lua-filter=callouts.lua"
  includes:
    in_header:
      - fa-header.html
      - _bioschemas.html
  config:
    sharing:
      facebook: no
      twitter: no
    toc: # Table of Contents
      collapse: subsection
      before: |
        <a href="https://bioinformaticsdotca.github.io/">
         <img src="img/bioinformatics_logo.png" width="90%" alt="bioinformatics.ca logo" style="display:block; margin-left:auto; margin-right:auto; margin-top:15px;">
         </a>
        <li><center><strong><a href="./"><br>Reproducible Research: Essentials for Managing Your Data<br><br></a></strong></center></li>
        <a href="./">
         <img src="img/RDM_icon.png" width="70%" alt="Reproducible Research: Essentials for Managing Your Data logo" style="display:block; margin-left:auto; margin-right:auto; ">
         </a>
        <br>

      after: |
        <h1 id="sponsors">Sponsors</h1>
        <center>
        <a href="https://www.cihr-irsc.gc.ca"><img src="img/sponsors/cihr.png" width=90% style="padding-bottom: 20px" alt="Canadian Institutes of Health Research logo."></a>

